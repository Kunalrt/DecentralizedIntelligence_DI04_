# Chimney Census Baseline Training Configuration
model:
  architecture: "yolo11s-obb.pt"  # Ultralytics pretrained OBB backbone (fallback: yolov8s-obb.pt)
  task: "obb"

data:
  config_path: "configs/data.yaml"
  imgsz: 256
  batch_size: 32
  workers: 4

train:
  epochs: 30
  patience: 10
  amp: true          # Automatic Mixed Precision
  cos_lr: true       # Cosine learning rate schedule
  lr0: 0.005
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5
  cls: 2.5
  dfl: 1.5
  degrees: 180.0     # Satellite nadir imagery is rotation-invariant
  fliplr: 0.5
  flipud: 0.5
  scale: 0.4         # Scale jitter 0.3 - 0.5
  shear: 0.0
  perspective: 0.0   # No perspective distortion for nadir satellite
  hsv_h: 0.0         # Strictly NO hue shift (preserves multispectral RGB calibration)
  hsv_s: 0.3         # Mild saturation jitter
  hsv_v: 0.3         # Mild brightness jitter
  mosaic: 1.0        # Mosaic enabled
  close_mosaic: 5    # Close mosaic for final 5 epochs
  mixup: 0.0
  copy_paste: 0.3
  seed: 42
  deterministic: true

infer:
  conf_threshold: 0.001  # Low confidence threshold (~0.001) to maximize recall for all-point mAP
  iou_threshold: 0.50    # Rotated NMS threshold
  device: "0"            # Auto-detected (GPU 0 if available, else CPU)
  save_csv: true
  submission_path: "submission.csv"
