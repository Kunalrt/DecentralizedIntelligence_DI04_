# Chimney Census Training Configuration
model:
  architecture: "yolov8n-obb.pt"  # Pretrained backbone for fast transfer & T4 efficiency
  task: "obb"

data:
  config_path: "configs/data.yaml"
  imgsz: 128
  batch_size: 64
  workers: 4

train:
  epochs: 30
  patience: 10
  lr0: 0.005
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5
  cls: 1.5         # Boosted classification loss weight for rare CFCBK
  dfl: 1.5
  degrees: 180.0   # Satellite overhead imagery is full-rotation invariant [0, 360)
  fliplr: 0.5
  flipud: 0.5
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.4
  mosaic: 0.5
  mixup: 0.1
  copy_paste: 0.2  # Critical for rare class CFCBK (~3%)

infer:
  conf_threshold: 0.001  # Low threshold to maximize recall for all-point interpolated mAP
  iou_threshold: 0.50   # NMS rotated IoU threshold
  device: "0"           # GPU 0, fallback to "cpu"
  save_csv: true
  submission_path: "submission.csv"
